<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Плеер</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f; color: #e0e0e0;
            height: 100vh; display: flex; overflow: hidden;
        }
        .sidebar {
            width: 340px; min-width: 280px;
            background: #1a1a1a; display: flex; flex-direction: column;
            border-right: 1px solid #2a2a2a;
        }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #2a2a2a; }
        .sidebar-header h1 { font-size: 1.2rem; margin-bottom: 12px; color: #fff; }
        .playlist-select {
            width: 100%; padding: 10px 12px;
            background: #2a2a2a; color: #e0e0e0;
            border: 1px solid #3a3a3a; border-radius: 8px;
            font-size: 0.9rem; outline: none; cursor: pointer; margin-bottom: 10px;
        }
        .playlist-select:focus { border-color: #4a9eff; }
        .reload-btn {
            width: 100%; padding: 10px 12px;
            background: #238636; color: #fff;
            border: none; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600;
            cursor: pointer; margin-bottom: 10px;
        }
        .reload-btn:hover:not(:disabled) { background: #2ea043; }
        .reload-btn:disabled { opacity: 0.5; cursor: wait; }
        .search-input {
            width: 100%; padding: 10px 12px;
            background: #2a2a2a; color: #e0e0e0;
            border: 1px solid #3a3a3a; border-radius: 8px;
            font-size: 0.9rem; outline: none;
        }
        .search-input:focus { border-color: #4a9eff; }
        .channel-list { flex: 1; overflow-y: auto; padding: 8px; }
        .channel-item {
            display: flex; align-items: center;
            padding: 10px 12px; border-radius: 8px;
            cursor: pointer; transition: background 0.15s; margin-bottom: 2px;
        }
        .channel-item:hover { background: #2a2a2a; }
        .channel-item.active { background: #4a9eff; color: #fff; }
        .channel-item img {
            width: 32px; height: 32px; object-fit: contain;
            border-radius: 4px; margin-right: 10px;
            background: #222; flex-shrink: 0;
        }
        .channel-item .channel-name {
            font-size: 0.85rem; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .main { flex: 1; display: flex; flex-direction: column; background: #000; }
        .video-container {
            flex: 1; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; outline: none; }
        .loading-overlay {
            position: absolute; inset: 0; display: none;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.7); z-index: 10;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #333; border-top-color: #4a9eff;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .now-playing {
            padding: 14px 20px; background: #1a1a1a;
            border-top: 1px solid #2a2a2a; font-size: 0.9rem;
            color: #aaa; display: flex; align-items: center; gap: 10px;
        }
        .now-playing .name { color: #fff; font-weight: 600; }
        .error-msg {
            color: #ff6b6b; padding: 12px;
            font-size: 0.85rem; text-align: center;
        }
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-track { background: transparent; }
        .channel-list::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
        @media (max-width: 768px) {
            .sidebar { width: 260px; min-width: 220px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>📺 IPTV Плеер</h1>
            <select class="playlist-select" id="playlistSelect">
                <option value="">— Выберите плейлист —</option>
                <option value="https://iptv-org.github.io/iptv/languages/rus.m3u">🇷🇺 Русский (язык)</option>
                <option value="https://iptv-org.github.io/iptv/countries/ru.m3u">🇷🇺 Россия (страна)</option>
                <option value="https://iptv-org.github.io/iptv/languages/hye.m3u">🇦🇲 Армянский (язык)</option>
                <option value="https://iptv-org.github.io/iptv/countries/am.m3u">🇦🇲 Армения (страна)</option>
            </select>
            <button class="reload-btn" id="reloadBtn">📥 Загрузить с GitHub</button>
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск канала...">
        </div>
        <div class="channel-list" id="channelList">
            <div class="error-msg">Выберите плейлист и нажмите «Загрузить с GitHub»</div>
        </div>
    </aside>

    <main class="main">
        <div class="video-container">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
            </div>
            <video id="videoPlayer" controls playsinline></video>
        </div>
        <div class="now-playing" id="nowPlaying">
            <span>Сейчас играет:</span>
            <span class="name" id="nowPlayingName">—</span>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            const playlistSelect = document.getElementById('playlistSelect');
            const reloadBtn      = document.getElementById('reloadBtn');
            const searchInput    = document.getElementById('searchInput');
            const channelList    = document.getElementById('channelList');
            const video          = document.getElementById('videoPlayer');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const nowPlayingName = document.getElementById('nowPlayingName');

            let hls = null;
            let allChannels = [];
            let currentChannelUrl = null;
            let currentChannelName = '';

            /* =========================================================
               ГЛАВНОЕ ИЗМЕНЕНИЕ: загрузка плейлиста через <script>
               (JSONP). Работает из file:// в Chrome на Android (Acode).
               Сначала пробуем обычный fetch — вдруг открыто через сервер.
               Если не вышло — падаем на JSONP.
               ========================================================= */
            function loadTextViaScript(url) {
                return new Promise(function (resolve, reject) {
                    var cb = '__m3u_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                    var script = document.createElement('script');
                    var timer = setTimeout(function () {
                        cleanup(new Error('Таймаут загрузки (20с)'));
                    }, 20000);

                    function cleanup(err, text) {
                        clearTimeout(timer);
                        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
                        if (script.parentNode) script.parentNode.removeChild(script);
                        if (err) reject(err); else resolve(text);
                    }

                    // Прокси allorigins возвращает JSON: { contents: "..." }
                    window[cb] = function (data) {
                        if (data && typeof data.contents === 'string') {
                            cleanup(null, data.contents);
                        } else {
                            cleanup(new Error('Пустой ответ прокси'));
                        }
                    };

                    script.onerror = function () {
                        cleanup(new Error('Не удалось загрузить скрипт-прокси'));
                    };

                    script.src = 'https://api.allorigins.win/get?callback=' + cb +
                                 '&url=' + encodeURIComponent(url);
                    document.head.appendChild(script);
                });
            }

            async function loadPlaylist(url) {
                if (!url) {
                    channelList.innerHTML = '<div class="error-msg">Выберите плейлист</div>';
                    allChannels = [];
                    return;
                }

                channelList.innerHTML = '<div class="error-msg">⏳ Загрузка плейлиста...</div>';
                reloadBtn.disabled = true;
                stopPlayback();

                let text = null;

                // Попытка 1: обычный fetch (сработает, если открыто через http/https)
                try {
                    const response = await fetch(url, { cache: 'no-store' });
                    if (response.ok) {
                        const t = await response.text();
                        if (/#EXTM3U|#EXTINF/i.test(t)) text = t;
                    }
                } catch (e) {
                    console.warn('fetch не сработал, перехожу на JSONP:', e.message);
                }

                // Попытка 2: JSONP через <script> (работает из file://)
                if (!text) {
                    try {
                        text = await loadTextViaScript(url);
                    } catch (e) {
                        console.error('JSONP тоже упал:', e);
                        reloadBtn.disabled = false;
                        channelList.innerHTML =
                            '<div class="error-msg">' +
                                '❌ Не удалось загрузить плейлист.<br><br>' +
                                'Проверь интернет и попробуй ещё раз.<br>' +
                                'Если не помогает — скачай .m3u вручную в браузере ' +
                                'и открой его любым способом.<br><br>' +
                                '<span style="font-size:0.75rem;opacity:0.6">' +
                                String(e.message || e) +
                                '</span>' +
                            '</div>';
                        return;
                    }
                }

                try {
                    const channels = parseM3U(text);
                    if (channels.length === 0) {
                        channelList.innerHTML = '<div class="error-msg">Плейлист пуст</div>';
                        return;
                    }
                    allChannels = channels;
                    renderChannels(allChannels);
                } catch (err) {
                    console.error('Парсинг упал:', err);
                    channelList.innerHTML = '<div class="error-msg">Ошибка парсинга: ' + err.message + '</div>';
                } finally {
                    reloadBtn.disabled = false;
                }
            }

            /* ---- Дальше — всё как в твоей рабочей версии ---- */

            function parseM3U(content) {
                const lines = content.split(/\r?\n/);
                const channels = [];
                let currentInfo = null;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        const info = line.substring(8);
                        const commaIdx = info.lastIndexOf(',');
                        let attrs = '', name = '';
                        if (commaIdx !== -1) {
                            attrs = info.substring(0, commaIdx);
                            name = info.substring(commaIdx + 1).trim();
                        } else attrs = info;
                        const logoMatch = attrs.match(/tvg-logo="([^"]*)"/i);
                        const nameMatch = attrs.match(/tvg-name="([^"]*)"/i);
                        currentInfo = {
                            name: nameMatch ? nameMatch[1] : (name || 'Без названия'),
                            logo: logoMatch ? logoMatch[1] : '',
                            url: null
                        };
                    } else if (line && !line.startsWith('#')) {
                        if (currentInfo) {
                            currentInfo.url = line;
                            channels.push({ ...currentInfo });
                            currentInfo = null;
                        } else {
                            channels.push({
                                name: 'Канал ' + (channels.length + 1),
                                logo: '',
                                url: line
                            });
                        }
                    }
                }
                return channels;
            }

            function renderChannels(channels) {
                if (channels.length === 0) {
                    channelList.innerHTML = '<div class="error-msg">Ничего не найдено</div>';
                    return;
                }
                const fragment = document.createDocumentFragment();
                channels.forEach((ch, idx) => {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    if (ch.url === currentChannelUrl) div.classList.add('active');
                    div.dataset.url = ch.url;
                    div.dataset.name = ch.name;
                    div.dataset.index = idx;

                    if (ch.logo) {
                        const img = document.createElement('img');
                        img.src = ch.logo;
                        img.alt = '';
                        img.loading = 'lazy';
                        img.referrerPolicy = 'no-referrer';
                        img.onerror = function () { this.style.display = 'none'; };
                        div.appendChild(img);
                    }

                    const span = document.createElement('span');
                    span.className = 'channel-name';
                    span.textContent = ch.name;
                    div.appendChild(span);

                    div.addEventListener('click', () => {
                        playChannel(ch.url, ch.name);
                    });

                    fragment.appendChild(div);
                });
                channelList.innerHTML = '';
                channelList.appendChild(fragment);
            }

            function playChannel(url, name) {
                if (!url) return;

                document.querySelectorAll('.channel-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.url === url);
                });

                currentChannelUrl = url;
                currentChannelName = name;
                nowPlayingName.textContent = name || '—';

                stopPlayback();
                loadingOverlay.classList.add('active');

                const isHls = url.includes('.m3u8') || url.includes('m3u8');

                if (isHls && Hls.isSupported()) {
                    hls = new Hls({
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60,
                        enableWorker: true,
                        lowLatencyMode: true,
                    });
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loadingOverlay.classList.remove('active');
                        video.play().catch(e => console.warn('Autoplay заблокирован:', e));
                    });
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.error('HLS ошибка:', data);
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hls.startLoad(); break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError(); break;
                                default:
                                    loadingOverlay.classList.remove('active');
                                    nowPlayingName.textContent = '❌ Ошибка: ' + (data.details || 'Не удалось воспроизвести');
                                    break;
                            }
                        }
                    });
                } else {
                    video.src = url;
                    video.load();
                    video.addEventListener('loadeddata', function onLoaded() {
                        video.removeEventListener('loadeddata', onLoaded);
                        loadingOverlay.classList.remove('active');
                        video.play().catch(e => console.warn('Autoplay заблокирован:', e));
                    });
                    video.addEventListener('error', function onErr() {
                        video.removeEventListener('error', onErr);
                        loadingOverlay.classList.remove('active');
                        nowPlayingName.textContent = '❌ Ошибка загрузки потока';
                    });
                }

                if (isHls && !Hls.isSupported() && video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loadingOverlay.classList.remove('active');
                        video.play().catch(e => console.warn('Autoplay заблокирован:', e));
                    });
                }
            }

            function stopPlayback() {
                if (hls) { hls.destroy(); hls = null; }
                video.pause();
                video.removeAttribute('src');
                video.load();
                loadingOverlay.classList.remove('active');
            }

            function filterChannels() {
                const query = searchInput.value.trim().toLowerCase();
                if (!query) { renderChannels(allChannels); return; }
                const filtered = allChannels.filter(ch =>
                    ch.name.toLowerCase().includes(query)
                );
                renderChannels(filtered);
            }

            /* ---- Обработчики ---- */
            playlistSelect.addEventListener('change', () => {
                // просто выбираем, автозагрузки нет — ждём кнопку
            });

            reloadBtn.addEventListener('click', () => {
                searchInput.value = '';
                loadPlaylist(playlistSelect.value);
            });

            searchInput.addEventListener('input', filterChannels);

            /* ---- Автозагрузка при старте ---- */
            const defaultPlaylist = 'https://iptv-org.github.io/iptv/languages/rus.m3u';
            playlistSelect.value = defaultPlaylist;
            loadPlaylist(defaultPlaylist);

        })();
    </script>
</body>
</html>
